    <text x="210" y="710" font-family="Arial, sans-serif" font-size="12" fill="#111827">1. Paracetamol 500mg</text>
    <text x="400" y="710" font-family="Arial, sans-serif" font-size="12" fill="#111827">1 tablet</text>
    <text x="520" y="710" font-family="Arial, sans-serif" font-size="12" fill="#111827">3 times daily</text>
    <text x="650" y="710" font-family="Arial, sans-serif" font-size="12" fill="#111827">5 days</text>
    <text x="770" y="710" font-family="Arial, sans-serif" font-size="12" fill="#111827">After meals</text>

    <rect x="190" y="720" width="820" height="30" fill="#f9fafb" stroke="#e2e8f0" stroke-width="1"/>
    <text x="210" y="740" font-family="Arial, sans-serif" font-size="12" fill="#111827">2. ORS Powder</text>
    <text x="400" y="740" font-family="Arial, sans-serif" font-size="12" fill="#111827">1 packet</text>
    <text x="520" y="740" font-family="Arial, sans-serif" font-size="12" fill="#111827">2 times daily</text>
    <text x="650" y="740" font-family="Arial, sans-serif" font-size="12" fill="#111827">3 days</text>
    <text x="770" y="740" font-family="Arial, sans-serif" font-size="12" fill="#111827">Mix with water</text>

    <rect x="190" y="750" width="820" height="30" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="210" y="770" font-family="Arial, sans-serif" font-size="12" fill="#111827">3. Vitamin B Complex</text>
    <text x="400" y="770" font-family="Arial, sans-serif" font-size="12" fill="#111827">1 capsule</text>
    <text x="520" y="770" font-family="Arial, sans-serif" font-size="12" fill="#111827">Once daily</text>
    <text x="650" y="770" font-family="Arial, sans-serif" font-size="12" fill="#111827">7 days</text>
    <text x="770" y="770" font-family="Arial, sans-serif" font-size="12" fill="#111827">After breakfast</text>

    <!-- Remaining parts like Doctor's Advice, Emergency, Digital Signature, QR, Footer etc. remain unchanged from your original. Let me know if you want the full SVG with all elements inlined or downloaded as a file. -->
</svg>
