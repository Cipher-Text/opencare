<svg width="1200" height="1800" viewBox="0 0 1200 1800" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="1200" height="1800" fill="#f9fafb"/>

    <!-- Header -->
    <rect x="0" y="0" width="1200" height="80" fill="white" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="50" y="25" width="30" height="30" rx="4" fill="#14b8a6"/>
    <text x="100" y="45" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#111827">BloodCare</text>
    <rect x="1050" y="25" width="100" height="30" rx="6" fill="none" stroke="#14b8a6" stroke-width="1"/>
    <text x="1100" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#14b8a6">Profile</text>

    <!-- Search Hero Section -->
    <rect x="0" y="80" width="1200" height="200" fill="#14b8a6"/>
    <text x="600" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">Find Blood Donors</text>
    <text x="600" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#a7f3d0">Search for blood donors in your area quickly and easily</text>

    <!-- Search Filters Card -->
    <rect x="100" y="200" width="1000" height="120" rx="12" fill="white" stroke="#d1d5db" stroke-width="1"/>

    <!-- Blood Group Filter -->
    <text x="130" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374751">Blood Group</text>
    <rect x="130" y="240" width="120" height="35" rx="6" fill="none" stroke="#14b8a6" stroke-width="2"/>
    <text x="190" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#14b8a6">A+ ▼</text>

    <!-- District Filter -->
    <text x="270" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374751">District</text>
    <rect x="270" y="240" width="150" height="35" rx="6" fill="none" stroke="#6b7280" stroke-width="1"/>
    <text x="345" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Select District ▼</text>

    <!-- Upazila Filter -->
    <text x="440" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374751">Upazila</text>
    <rect x="440" y="240" width="150" height="35" rx="6" fill="none" stroke="#6b7280" stroke-width="1"/>
    <text x="515" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Select Upazila ▼</text>

    <!-- Availability Filter -->
    <text x="610" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374751">Availability</text>
    <rect x="610" y="240" width="130" height="35" rx="6" fill="none" stroke="#6b7280" stroke-width="1"/>
    <text x="675" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Available Now ▼</text>

    <!-- Search Button -->
    <rect x="760" y="240" width="100" height="35" rx="6" fill="#14b8a6"/>
    <text x="810" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">Search</text>

    <!-- Clear Filters -->
    <text x="880" y="262" font-family="Arial, sans-serif" font-size="14" fill="#6b7280" text-decoration="underline">Clear All</text>

    <!-- Emergency Request Button -->
    <rect x="130" y="285" width="180" height="25" rx="12" fill="#dc2626"/>
    <text x="220" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">🚨 Emergency Request</text>

    <!-- Quick Blood Group Tabs -->
    <rect x="100" y="340" width="1000" height="60" fill="white" stroke="#d1d5db" stroke-width="1"/>
    <text x="130" y="360" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374751">Quick Search:</text>

    <rect x="130" y="370" width="60" height="25" rx="12" fill="#14b8a6"/>
    <text x="160" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">A+</text>

    <rect x="200" y="370" width="60" height="25" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <text x="230" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">A-</text>

    <rect x="270" y="370" width="60" height="25" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <text x="300" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">B+</text>

    <rect x="340" y="370" width="60" height="25" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <text x="370" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">B-</text>

    <rect x="410" y="370" width="60" height="25" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <text x="440" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">O+</text>

    <rect x="480" y="370" width="60" height="25" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <text x="510" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">O-</text>

    <rect x="550" y="370" width="60" height="25" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <text x="580" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">AB+</text>

    <rect x="620" y="370" width="60" height="25" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <text x="650" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">AB-</text>

    <!-- Results Header -->
    <rect x="100" y="420" width="700" height="50" fill="white" stroke="#d1d5db" stroke-width="1"/>
    <text x="130" y="445" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111827">Donors Found (24)</text>
    <text x="130" y="460" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Blood Group: A+ | District: Dhaka</text>

    <!-- Sort Options -->
    <text x="650" y="445" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Sort by:</text>
    <rect x="650" y="450" width="120" height="15" fill="none" stroke="#6b7280" stroke-width="1"/>
    <text x="710" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Distance ▼</text>

    <!-- Donor List -->
    <rect x="100" y="470" width="700" height="1150" fill="white" stroke="#d1d5db" stroke-width="1"/>

    <!-- Donor Card 1 -->
    <rect x="120" y="490" width="660" height="120" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <circle cx="160" cy="530" r="25" fill="#14b8a6"/>
    <text x="160" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">A+</text>

    <text x="200" y="510" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111827">Mohammad Rahman</text>
    <text x="200" y="530" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">📍 Dhanmondi, Dhaka | 2.5 km away</text>
    <text x="200" y="550" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">📞 +8801712345678</text>
    <text x="200" y="570" font-family="Arial, sans-serif" font-size="14" fill="#10b981">🟢 Available | Last donated: 3 months ago</text>

    <rect x="580" y="510" width="80" height="30" rx="6" fill="#14b8a6"/>
    <text x="620" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Contact</text>
    <rect x="580" y="550" width="80" height="30" rx="6" fill="none" stroke="#14b8a6" stroke-width="1"/>
    <text x="620" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#14b8a6">View Profile</text>

    <!-- Donor Card 2 -->
    <rect x="120" y="620" width="660" height="120" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <circle cx="160" cy="660" r="25" fill="#14b8a6"/>
    <text x="160" y="668" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">A+</text>

    <text x="200" y="640" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111827">Fatima Khatun</text>
    <text x="200" y="660" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">📍 Uttara, Dhaka | 5.2 km away</text>
    <text x="200" y="680" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">📞 +8801987654321</text>
    <text x="200" y="700" font-family="Arial, sans-serif" font-size="14" fill="#f59e0b">🟡 Busy | Last donated: 2 months ago</text>

    <rect x="580" y="640" width="80" height="30" rx="6" fill="#6b7280"/>
    <text x="620" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Contact</text>
    <rect x="580" y="680" width="80" height="30" rx="6" fill="none" stroke="#6b7280" stroke-width="1"/>
    <text x="620" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">View Profile</text>

    <!-- Donor Card 3 -->
    <rect x="120" y="750" width="660" height="120" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <circle cx="160" cy="790" r="25" fill="#14b8a6"/>
    <text x="160" y="798" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">A+</text>

    <text x="200" y="770" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111827">Dr. Ahmed Hassan</text>
    <text x="200" y="790" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">📍 Gulshan, Dhaka | 7.8 km away</text>
    <text x="200" y="810" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">📞 +8801555666777</text>
    <text x="200" y="830" font-family="Arial, sans-serif" font-size="14" fill="#10b981">🟢 Available | Last donated: 4 months ago</text>

    <rect x="580" y="770" width="80" height="30" rx="6" fill="#14b8a6"/>
    <text x="620" y="790" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Contact</text>
    <rect x="580" y="810" width="80" height="30" rx="6" fill="none" stroke="#14b8a6" stroke-width="1"/>
    <text x="620" y="830" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#14b8a6">View Profile</text>

    <!-- Load More Button -->
    <rect x="350" y="1580" width="120" height="35" rx="6" fill="none" stroke="#14b8a6" stroke-width="1"/>
    <text x="410" y="1602" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#14b8a6">Load More</text>

    <!-- Sidebar -->
    <rect x="820" y="420" width="280" height="1200" fill="white" stroke="#d1d5db" stroke-width="1"/>

    <!-- Emergency Contacts -->
    <text x="840" y="450" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111827">Emergency Contacts</text>
    <rect x="840" y="460" width="240" height="80" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="855" y="480" font-family="Arial, sans-serif" font-size="14" fill="#dc2626">🚨 Blood Bank Emergency</text>
    <text x="855" y="500" font-family="Arial, sans-serif" font-size="14" fill="#dc2626">📞 999 (National Emergency)</text>
    <text x="855" y="520" font-family="Arial, sans-serif" font-size="14" fill="#dc2626">📞 16263 (Health Helpline)</text>

    <!-- Blood Compatibility Chart -->
    <text x="840" y="570" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111827">Blood Compatibility</text>
    <rect x="840" y="580" width="240" height="150" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
    <text x="855" y="600" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#14b8a6">A+ can receive from:</text>
    <text x="855" y="620" font-family="Arial, sans-serif" font-size="12" fill="#374751">• A+ (Same type)</text>
    <text x="855" y="635" font-family="Arial, sans-serif" font-size="12" fill="#374751">• A- (Compatible)</text>
    <text x="855" y="650" font-family="Arial, sans-serif" font-size="12" fill="#374751">• O+ (Universal donor)</text>
    <text x="855" y="665" font-family="Arial, sans-serif" font-size="12" fill="#374751">• O- (Universal donor)</text>
    <text x="855" y="690" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#14b8a6">A+ can donate to:</text>
    <text x="855" y="710" font-family="Arial, sans-serif" font-size="12" fill="#374751">• A+ (Same type)</text>
    <text x="855" y="725" font-family="Arial, sans-serif" font-size="12" fill="#374751">• AB+ (Universal recipient)</text>

    <!-- Quick Actions -->
    <text x="840" y="760" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111827">Quick Actions</text>
    <rect x="840" y="775" width="240" height="35" rx="6" fill="#14b8a6"/>
    <text x="960" y="797" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">Register as Donor</text>

    <rect x="840" y="820" width="240" height="35" rx="6" fill="none" stroke="#14b8a6" stroke-width="1"/>
    <text x="960" y="842" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#14b8a6">Request Blood</text>

    <rect x="840" y="865" width="240" height="35" rx="6" fill="none" stroke="#6b7280" stroke-width="1"/>
    <text x="960" y="887" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Donation History</text>

    <!-- Statistics -->
    <text x="840" y="930" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111827">Today's Statistics</text>
    <rect x="840" y="945" width="240" height="120" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
    <text x="855" y="970" font-family="Arial, sans-serif" font-size="14" fill="#10b981">✅ 12 successful donations</text>
    <text x="855" y="990" font-family="Arial, sans-serif" font-size="14" fill="#14b8a6">🔍 48 search requests</text>
    <text x="855" y="1010" font-family="Arial, sans-serif" font-size="14" fill="#3b82f6">👥 156 active donors online</text>
    <text x="855" y="1030" font-family="Arial, sans-serif" font-size="14" fill="#f59e0b">⏰ 23 emergency requests</text>
    <text x="855" y="1050" font-family="Arial, sans-serif" font-size="14" fill="#8b5cf6">📍 Dhaka area coverage: 95%</text>

    <!-- Footer -->
    <rect x="0" y="1720" width="1200" height="80" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <text x="600" y="1765" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">© 2025 BloodCare. Saving lives together.</text>
</svg>