    <!-- Doctor Name and Info -->
    <text x="300" y="140" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#111827">Dr. Md Sidur Rahman</text>
    <text x="300" y="165" font-family="Arial, sans-serif" font-size="18" fill="#0d9488">Dr. Md Sidur Rahman</text>

