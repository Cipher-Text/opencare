        <path d="M11 2a2 2 0 0 0-2 2v6.5a6.5 6.5 0 0 0 13 0V4a2 2 0 0 0-2-2" stroke="#14b8a6" stroke-width="1.5" fill="none" transform="scale(0.8)"/>
        <circle cx="16" cy="8" r="1.6" stroke="#14b8a6" stroke-width="1.5" fill="none"/>
        <text x="25" y="12" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Allergy and immunology</text>
    </g>

