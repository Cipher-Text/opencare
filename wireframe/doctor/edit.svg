    <!-- Primary Specialization -->
    <text x="140" y="580" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Primary Specialization *</text>
    <rect x="140" y="590" width="450" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="150" y="615" font-family="Arial, sans-serif" font-size="14" fill="#111827">Allergy and immunology</text>
    <!-- Dropdown Arrow -->
    <path d="M580 610 L570 600 L590 600 Z" fill="#94a3b8"/>

    <!-- Other Specializations -->
    <text x="610" y="580" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Other Specializations</text>
    <rect x="610" y="590" width="450" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="620" y="615" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Select specialization</text>
    <!-- Dropdown Arrow -->
    <path d="M1050 610 L1040 600 L1060 600 Z" fill="#94a3b8"/>

