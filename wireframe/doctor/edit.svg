    <text x="970" y="672" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#0f766e">+ Add More</text>

    <!-- Qualification & Degrees -->
    <text x="140" y="650" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Highest Qualification *</text>
    <rect x="140" y="660" width="450" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="150" y="685" font-family="Arial, sans-serif" font-size="14" fill="#111827">MBBS</text>
    <!-- Dropdown Arrow -->
    <path d="M580 680 L570 670 L590 670 Z" fill="#94a3b8"/>

    <!-- Education Section -->
    <rect x="120" y="760" width="960" height="500" rx="12" fill="white" stroke="#5eead4" stroke-width="1"/>

    <!-- Education Header -->
    <g transform="translate(140, 780)">
        <rect x="0" y="6" width="16" height="2" rx="1" fill="#0f766e"/>
        <polygon points="8,2 2,6 14,6" fill="#0f766e"/>
        <text x="25" y="12" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f766e">Education</text>
    </g>

    <!-- Education Item 1 -->
    <rect x="140" y="820" width="920" height="180" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Degree Field -->
    <text x="160" y="850" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Degree Title *</text>
    <rect x="160" y="860" width="420" height="40" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
    <text x="170" y="885" font-family="Arial, sans-serif" font-size="14" fill="#111827">Bachelor of Medicine and Bachelor of Surgery (MBBS)</text>

    <!-- Institution Field -->
    <text x="600" y="850" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Institution *</text>
