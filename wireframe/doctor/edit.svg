    <text x="600" y="1110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Add another education entry</text>

    <!-- Add Education Button -->
    <rect x="820" y="1210" width="240" height="40" rx="6" fill="none" stroke="#2dd4bf" stroke-width="1"/>
    <text x="940" y="1235" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#0f766e">+ Add Another Education</text>

    <!-- Workplace Section -->
    <rect x="120" y="1280" width="960" height="500" rx="12" fill="white" stroke="#5eead4" stroke-width="1"/>

