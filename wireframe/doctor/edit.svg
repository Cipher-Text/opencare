        <circle cx="8" cy="8" r="2" fill="#0f766e"/>
        <text x="25" y="12" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f766e">Professional Associations</text>
    </g>

    <!-- Association Item 1 -->
    <rect x="140" y="1860" width="920" height="180" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Association Name Field -->
    <text x="160" y="1890" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Association Name *</text>
    <rect x="160" y="1900" width="420" height="40" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
    <text x="170" y="1925" font-family="Arial, sans-serif" font-size="14" fill="#111827">Bangladesh Medical Association (BMA)</text>

    <!-- Member Since Field -->
    <text x="600" y="1890" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Member Since *</text>
    <rect x="600" y="1900" width="420" height="40" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
    <text x="610" y="1925" font-family="Arial, sans-serif" font-size="14" fill="#111827">2018</text>

    <!-- Member ID Field -->
    <text x="160" y="1960" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Member ID</text>
    <rect x="160" y="1970" width="250" height="40" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
    <text x="170" y="1995" font-family="Arial, sans-serif" font-size="14" fill="#111827">BMA-2018-5247</text>

    <!-- Status Field -->
    <text x="430" y="1960" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Status</text>
    <rect x="430" y="1970" width="250" height="40" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
    <text x="440" y="1995" font-family="Arial, sans-serif" font-size="14" fill="#111827">ACTIVE MEMBER</text>
    <!-- Dropdown Arrow -->
    <path d="M670 1990 L660 1980 L680 1980 Z" fill="#94a3b8"/>

    <!-- Remove Button -->
    <rect x="700" y="1970" width="150" height="40" rx="6" fill="#fee2e2" stroke="#fecaca" stroke-width="1"/>
    <text x="775" y="1995" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#ef4444">Remove</text>

    <!-- Association Item 2 -->
    <rect x="140" y="2060" width="920" height="180" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4"/>
    <text x="600" y="2150" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Add another association entry</text>

    <!-- Add Association Button -->
    <rect x="820" y="2250" width="240" height="40" rx="6" fill="none" stroke="#2dd4bf" stroke-width="1"/>
    <text x="940" y="2275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#0f766e">+ Add Another Association</text>

    <!-- Schedule Section -->
    <rect x="120" y="2320" width="960" height="240" rx="12" fill="white" stroke="#5eead4" stroke-width="1"/>
    <g transform="translate(140, 2340)">
        <rect x="0" y="0" width="16" height="16" rx="2" stroke="#0f766e" stroke-width="1.5" fill="none"/>
        <path d="M4 8 L8 12 L12 4" stroke="#0f766e" stroke-width="1.5" fill="none"/>
        <text x="25" y="12" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f766e">Schedule Management</text>
    </g>

    <text x="140" y="2380" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">To edit your weekly schedule, please use the Schedule Management page.</text>
    <rect x="140" y="2410" width="240" height="40" rx="6" fill="#14b8a6"/>
    <text x="260" y="2435" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="white">Manage Schedule</text>

    <!-- Action Buttons -->
    <rect x="120" y="2580" width="960" height="100" rx="12" fill="#f0fdfa"/>

    <!-- Save Button -->
    <rect x="740" y="2610" width="160" height="40" rx="6" fill="#14b8a6"/>
    <text x="820" y="2635" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="white">Save Changes</text>

    <!-- Cancel Button -->
    <rect x="920" y="2610" width="140" height="40" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
    <text x="990" y="2635" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Cancel</text>

    <!-- Footer -->
    <text x="600" y="2720" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">© 2025 Medical Directory. All rights reserved.</text>
</svg>