    <text x="170" y="955" font-family="Arial, sans-serif" font-size="14" fill="#111827">Dhaka</text>

    <!-- Year Field -->
    <text x="430" y="920" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Year</text>
    <rect x="430" y="930" width="150" height="40" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
    <text x="440" y="955" font-family="Arial, sans-serif" font-size="14" fill="#111827">2015</text>

    <!-- Level Field -->
    <text x="600" y="920" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Level</text>
    <rect x="600" y="930" width="250" height="40" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
    <text x="610" y="955" font-family="Arial, sans-serif" font-size="14" fill="#111827">UNDERGRADUATE</text>
