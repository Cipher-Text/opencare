<svg width="1200" height="2800" viewBox="0 0 1200 2800" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="1200" height="2800" fill="#f9fafb"/>

    <!-- Container -->
    <rect x="100" y="50" width="1000" height="2700" fill="none"/>

    <!-- Header - Edit Profile -->
    <rect x="120" y="80" width="960" height="120" rx="12" fill="white" stroke="#5eead4" stroke-width="2"/>
    <text x="140" y="140" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0f766e">Edit Doctor Profile</text>
    <text x="140" y="170" font-family="Arial, sans-serif" font-size="16" fill="#6b7280">Update your information and add your qualifications</text>

    <!-- Profile Image Section -->
    <rect x="120" y="220" width="260" height="280" rx="12" fill="white" stroke="#5eead4" stroke-width="1"/>
    <circle cx="250" cy="320" r="80" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="4"/>
    <text x="250" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0f766e">DS</text>

    <!-- Upload Photo Button -->
    <rect x="170" y="430" width="160" height="40" rx="6" fill="#14b8a6"/>
    <text x="250" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="white">Upload Photo</text>

    <!-- Personal Information Card -->
    <rect x="400" y="220" width="680" height="280" rx="12" fill="white" stroke="#5eead4" stroke-width="1"/>
    <text x="420" y="250" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f766e">Personal Information</text>

    <!-- Form Fields -->
    <!-- Name Field -->
    <text x="420" y="280" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Full Name *</text>
    <rect x="420" y="290" width="300" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="430" y="315" font-family="Arial, sans-serif" font-size="14" fill="#111827">Dr. Md Sidur Rahman</text>

    <!-- Gender Field -->
    <text x="740" y="280" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Gender *</text>
    <rect x="740" y="290" width="300" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Gender Options -->
    <circle cx="760" cy="310" r="8" fill="white" stroke="#2dd4bf" stroke-width="1.5"/>
    <circle cx="760" cy="310" r="4" fill="#2dd4bf"/>
    <text x="775" y="315" font-family="Arial, sans-serif" font-size="14" fill="#111827">Female</text>

    <circle cx="850" cy="310" r="8" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="865" y="315" font-family="Arial, sans-serif" font-size="14" fill="#111827">Male</text>

    <circle cx="930" cy="310" r="8" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="945" y="315" font-family="Arial, sans-serif" font-size="14" fill="#111827">Other</text>

    <!-- BMDC Field -->
    <text x="420" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#6b7280">BMDC Registration Number *</text>
    <rect x="420" y="360" width="300" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="430" y="385" font-family="Arial, sans-serif" font-size="14" fill="#111827">A-52508</text>

    <!-- Phone Field -->
    <text x="740" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Phone Number *</text>
    <rect x="740" y="360" width="300" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="750" y="385" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Enter your phone number</text>

    <!-- Email Field -->
    <text x="420" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Email Address</text>
    <rect x="420" y="430" width="300" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="750" y="455" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Enter your email address</text>

    <!-- Blood Group Field -->
    <text x="740" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Blood Group</text>
    <rect x="740" y="430" width="300" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="750" y="455" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Select blood group</text>

    <!-- Dropdown Arrow -->
    <path d="M1020 450 L1010 440 L1030 440 Z" fill="#94a3b8"/>

