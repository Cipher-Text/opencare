    <text x="600" y="1630" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Add another workplace entry</text>

    <!-- Add Workplace Button -->
    <rect x="820" y="1730" width="240" height="40" rx="6" fill="none" stroke="#2dd4bf" stroke-width="1"/>
    <text x="940" y="1755" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#0f766e">+ Add Another Workplace</text>

    <!-- Association Section -->
