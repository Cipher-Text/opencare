    <g transform="translate(140, 1300)">
        <rect x="0" y="2" width="16" height="12" rx="1" stroke="#0f766e" stroke-width="1.5" fill="none"/>
        <rect x="2" y="0" width="12" height="4" fill="#0f766e"/>
        <text x="25" y="12" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f766e">Workplace</text>
