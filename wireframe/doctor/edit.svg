    <rect x="160" y="1380" width="420" height="40" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
    <text x="170" y="1405" font-family="Arial, sans-serif" font-size="14" fill="#111827">Dhaka Medical College Hospital</text>

    <!-- Position Field -->
    <text x="600" y="1370" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Position *</text>
    <rect x="600" y="1380" width="420" height="40" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
    <text x="610" y="1405" font-family="Arial, sans-serif" font-size="14" fill="#111827">Surgeon</text>

    <!-- Location Field -->
    <text x="160" y="1440" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Location</text>
    <rect x="160" y="1450" width="250" height="40" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
    <text x="170" y="1475" font-family="Arial, sans-serif" font-size="14" fill="#111827">Dhaka</text>

    <!-- Website Field -->
    <text x="430" y="1440" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Website</text>
    <rect x="430" y="1450" width="420" height="40" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
    <text x="440" y="1475" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Enter website URL</text>

    <!-- Remove Button -->
    <rect x="870" y="1450" width="150" height="40" rx="6" fill="#fee2e2" stroke="#fecaca" stroke-width="1"/>
    <text x="945" y="1475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#ef4444">Remove</text>

    <!-- Workplace Item 2 (Empty) -->
