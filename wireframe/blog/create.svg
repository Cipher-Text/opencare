    <text x="960" y="325" font-family="Arial, sans-serif" font-size="12" fill="#374751">• Start with a compelling introduction</text>
    <text x="960" y="345" font-family="Arial, sans-serif" font-size="12" fill="#374751">• Use subheadings to organize content</text>
